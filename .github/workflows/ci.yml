name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"
      - run: yarn install --frozen-lockfile
      - run: yarn workspace wireai-rn typecheck
      - run: yarn workspace wireai-rn test
      - run: yarn workspace wireai-rn build
      - name: Verify dist output
        run: |
          test -f packages/core/dist/index.js || exit 1
          test -f packages/core/dist/index.mjs || exit 1
          test -f packages/core/dist/index.d.ts || exit 1
          echo "✅ All dist files present"
